<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="1200" height="920" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="48" y="52" font-size="28" font-weight="700" fill="#0f172a">Feature-oriented Astro + Jails</text><text x="48" y="82" font-size="16" fill="#475569">Structure and responsibilities extracted from Astro Movies</text><rect x="32" y="110" width="1136" height="470" rx="18" fill="#eef2ff" stroke="#c7d2fe"/><text x="52" y="142" font-size="18" font-weight="700" fill="#3730a3">SERVER · ASTRO SSR</text><rect x="32" y="610" width="1136" height="240" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/><text x="52" y="643" font-size="18" font-weight="700" fill="#065f46">BROWSER · HTML + INTERACTIVITY JAILS</text><rect x="60" y="170" width="240" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="76" y="198" font-size="17" font-weight="700" fill="#0f172a">pages/</text><text x="76" y="223" font-size="14" fill="#475569">Routes and parameters</text><text x="76" y="243" font-size="14" fill="#475569">Props for detail screens</text><rect x="360" y="170" width="340" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="376" y="198" font-size="17" font-weight="700" fill="#0f172a">domain/&lt;feature&gt;/</text><text x="376" y="223" font-size="14" fill="#475569">Astro screens and local components</text><text x="376" y="243" font-size="14" fill="#475569">Composes UI; may query services</text><rect x="780" y="170" width="340" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="796" y="198" font-size="17" font-weight="700" fill="#0f172a">shared/services/&lt;provider&gt;/</text><text x="796" y="223" font-size="14" fill="#475569">Asynchronous query functions</text><text x="796" y="243" font-size="14" fill="#475569">Applies entity to HTTP response</text><rect x="360" y="340" width="340" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="376" y="368" font-size="17" font-weight="700" fill="#0f172a">layouts/default.astro</text><text x="376" y="393" font-size="14" fill="#475569">Document, shell and slot</text><text x="376" y="413" font-size="14" fill="#475569">Navigation, footer and bootstrap</text><rect x="60" y="470" width="640" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="76" y="498" font-size="17" font-weight="700" fill="#0f172a">UI components</text><text x="76" y="523" font-size="14" fill="#475569">domain/.../components: exclusive to the feature</text><text x="76" y="543" font-size="14" fill="#475569">shared/components: reused across screens or global</text><rect x="780" y="340" width="160" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="796" y="368" font-size="17" font-weight="700" fill="#0f172a">http.ts</text><text x="796" y="393" font-size="14" fill="#475569">fetch + JSON</text><text x="796" y="413" font-size="14" fill="#475569">External API</text><rect x="960" y="470" width="160" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="976" y="498" font-size="17" font-weight="700" fill="#0f172a">entities/</text><text x="976" y="523" font-size="14" fill="#475569">Pure factories¹</text><text x="976" y="543" font-size="14" fill="#475569">Data for UI</text><rect x="60" y="690" width="290" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="76" y="718" font-size="17" font-weight="700" fill="#0f172a">shared/main.ts</text><text x="76" y="743" font-size="14" fill="#475569">register + start</text><text x="76" y="763" font-size="14" fill="#475569">Starts when DOM is ready</text><rect x="420" y="690" width="320" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="436" y="718" font-size="17" font-weight="700" fill="#0f172a">application.ts + index.ts</text><text x="436" y="743" font-size="14" fill="#475569">Global coordination and local control</text><text x="436" y="763" font-size="14" fill="#475569">app-* tags connect HTML and Jails</text><rect x="810" y="690" width="310" height="94" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="826" y="718" font-size="17" font-weight="700" fill="#0f172a">State and events</text><text x="826" y="743" font-size="14" fill="#475569">model, state.set, html-*</text><text x="826" y="763" font-size="14" fill="#475569">publish / subscribe / emit</text><path d="M300 217 H360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 217 H780" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 264 V340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M530 434 V470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M360 240 H324 V514 H700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M860 264 V340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1040 264 V470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 264 V300 H748 V238 H780" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="292" font-size="13" fill="#475569">Detail: route also queries</text><path d="M390 564 V594 H205 V690" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="597" font-size="13" fill="#475569">HTML and scripts</text><path d="M350 737 H420" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M740 737 H810" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="52" y="829" font-size="14" fill="#065f46">MPA: links load new pages. Jails adds behavior to rendered HTML.</text><text x="48" y="884" font-size="14" fill="#475569">Arrows: usage/dependency. Services normalize responses before returning them to screens.</text><text x="48" y="905" font-size="13" fill="#64748b">¹ Target pattern: no I/O; the original mutates arrays when sorting. Domain contains screens, not a pure domain.</text></g></svg>